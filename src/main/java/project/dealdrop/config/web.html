<!DOCTYPE html>
<html>

<head>
    <title>WebSocket Test</title>
</head>

<body>

<h2>Spring WebSocket Test</h2>

<button onclick="connect()">1. Connect</button>
<button onclick="subscribe()">2. Subscribe</button>
<button onclick="sendMessage()">3. Send</button>

<pre id="output"></pre>

<script>

let socket;

function log(message) {
    document.getElementById("output").textContent += message + "\n";
}

function connect() {

    log("Connecting...");

    socket = new WebSocket("ws://localhost:8080/ws");

    socket.onopen = function () {

        log("WebSocket connected!");

        const connectFrame =
            "CONNECT\n" +
            "accept-version:1.2\n" +
            "host:localhost\n" +
            "\n" +
            "\0";

        socket.send(connectFrame);

        log("STOMP CONNECT sent");
    };

    socket.onmessage = function(event) {

        log("SERVER:");
        log(event.data);
    };

    socket.onerror = function(event) {

        log("❌ WebSocket ERROR");
        console.log(event);
    };

    socket.onclose = function(event) {

        log("Connection closed");
        log("Code: " + event.code);
        log("Reason: " + event.reason);
    };
}


function subscribe() {

    if (!socket || socket.readyState !== WebSocket.OPEN) {

        log("❌ WebSocket is not connected");
        return;
    }

    const subscribeFrame =
        "SUBSCRIBE\n" +
        "id:sub-0\n" +
        "destination:/topic/greetings\n" +
        "\n" +
        "\0";

    socket.send(subscribeFrame);

    log("Subscribed to /topic/greetings");
}


function sendMessage() {

    if (!socket || socket.readyState !== WebSocket.OPEN) {

        log("❌ WebSocket is not connected");
        return;
    }

    const sendFrame =
        "SEND\n" +
        "destination:/app/hello\n" +
        "\n" +
        "\0";

    socket.send(sendFrame);

    log("Message sent to /app/hello");
}

</script>

</body>

</html>
